name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever needs to read the tree. Without this the job inherits
# the repository default, which is read-write for every scope.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm exec biome ci .

      # A citation to an untracked working document inside a JSDoc comment survives into
      # the published .d.ts files, so the package would leak internal structure to every
      # consumer. See scripts/strip-internal-refs.mjs.
      - name: No references to internal documents
        run: node scripts/strip-internal-refs.mjs --check

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Size limit
        run: pnpm --filter @the_viveksingh/vivek-ui size

      - name: Assert the published package has no runtime dependencies
        run: |
          node -e "
            const pkg = require('./packages/ui/package.json');
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error('@the_viveksingh/vivek-ui must ship zero runtime dependencies, found: ' + deps.join(', '));
              process.exit(1);
            }
            console.log('OK: no runtime dependencies');
          "

  react18:
    name: react 18 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm --filter @the_viveksingh/vivek-ui build

      # The peer range promises ^18 || ^19, so CI has to prove it.
      - name: Re-test against React 18
        run: |
          pnpm --filter @the_viveksingh/vivek-ui add -D react@18.3.1 react-dom@18.3.1 @types/react@18.3.12 @types/react-dom@18.3.1
          pnpm --filter @the_viveksingh/vivek-ui test
