name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm -r test

      # Without the secret the release step cannot do anything useful, and failing
      # red on every push is noise. Skip with a notice instead.
      - name: Check for npm credentials
        id: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN is not set - skipping release. Add it under Settings > Secrets and variables > Actions."
          fi

      # With pending changesets this opens/updates the "Version Packages" PR.
      # Once that PR is merged there are no changesets left, so `publish` runs instead.
      - name: Create release PR or publish
        if: steps.npm.outputs.configured == 'true'
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # changesets shells out to `pnpm publish`, which ignores
          # publishConfig.provenance - that is npm-CLI-only. This env var is what
          # actually produces the attestation. Verify with `npm audit signatures`.
          NPM_CONFIG_PROVENANCE: 'true'
