name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Pushing the "Version Packages" branch and the release tags.
  contents: write
  # Opening and updating the "Version Packages" PR.
  pull-requests: write
  # The OIDC token npm exchanges for a short-lived publish credential. Without this the
  # trusted-publishing handshake cannot happen and npm falls back to looking for a token,
  # which this package no longer accepts.
  id-token: write

jobs:
  version:
    name: Version or hand off to publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # 'false' means the version PR has just been merged and a publish is due.
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      # persist-credentials must stay at its default (true). The changesets action pushes
      # the version branch with the plain git CLI, using the credentials checkout writes
      # into .git/config - GITHUB_TOKEN below is only used for the GitHub API. Setting
      # persist-credentials: false is a common hardening step and it would break this
      # workflow with "could not read Username".
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The library has to exist before the tests run: apps/docs imports it by package name,
      # so its tests resolve through the exports map to dist/. See the same note in ci.yml.
      - name: Build the library
        run: pnpm --filter @the_viveksingh/vivek-ui build

      - name: Test
        run: pnpm -r test

      # Versioning only. The `publish` input is deliberately NOT passed.
      #
      # Given a publish script, this action writes $HOME/.npmrc before publishing:
      #
      #   `//registry.npmjs.org/:_authToken=${process.env.NPM_TOKEN}`
      #
      # That is a JS template literal evaluated at runtime, so with no NPM_TOKEN it writes
      # the LITERAL text `_authToken=undefined` - not an inert placeholder, but a credential
      # npm will find and try to use. There is no input to turn that off. The action's own
      # `hasChangesets` output is documented for exactly this case ("useful if you want to
      # create your own publishing functionality"), so publishing is the separate job below.
      #
      # With changesets present this opens or updates the "Version Packages" PR. Note the PR
      # body will say to "publish to npm yourself" - a side effect of omitting the publish
      # input. Merging it does publish, via the publish job.
      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@e0145edc7d9d8679003495b11f87bd8ef63c0cba # v1.5.3
        with:
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    # npm trusted publishing does not support self-hosted runners. Keep this on a
    # GitHub-hosted runner or the OIDC exchange is rejected.
    timeout-minutes: 20
    #
    # A protected environment, and the reason publish is its own job: `environment:` is a
    # job-level key, so the approval gate could not be attached to a publish *step*. Without
    # this gate, anyone with push access to main - a compromised laptop, a leaked PAT, a
    # malicious editor extension running git - could land a pre-versioned commit and have CI
    # publish it WITH a valid provenance attestation, laundering the compromise. The
    # environment's required-reviewer rule puts a human between "code on main" and "code on
    # npm".
    #
    # One-time setup (Settings -> Environments): create `npm-publish` and add the maintainer
    # as a required reviewer. This job pauses until approved.
    environment: npm-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Deliberately NO `registry-url:` here.
      #
      # setup-node's registry-url writes an .npmrc containing
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and points npm at it. With
      # trusted publishing there is no NODE_AUTH_TOKEN, so that file is at best dead weight
      # and at worst shadows the OIDC credential.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # THE step that makes trusted publishing work, and the least obvious one.
      #
      # npm requires CLI >= 11.5.1 for the OIDC exchange. Node 22 LTS still bundles npm
      # 10.9.x, so the runner's default npm is too old and publishing fails with ENEEDAUTH
      # that looks like a misconfigured trusted publisher.
      #
      # Why upgrading *npm* fixes a *pnpm* repo: `changeset publish` resolves the publish
      # tool from the workspace and picks pnpm here, but pnpm 9's publish is a thin wrapper -
      # `runNpm(opts.npmPath, ["publish", ...])` in pnpm 9.15.9 - so the actual publish is
      # performed by whichever npm is on PATH. That means the repo does NOT need pnpm 10/11
      # (which would block dependency postinstall scripts by default and break esbuild).
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version) / node $(node --version)"

      # --ignore-scripts: this is the one job holding a publish-capable credential, and
      # pnpm 9 runs dependency lifecycle scripts by default - so without the flag every
      # devDependency's postinstall executes with that credential in reach. `pnpm rebuild`
      # then runs the few that are genuinely needed, BY NAME - an allowlist, instead of open
      # season for a whole dependency tree.
      #
      # Both entries download a platform binary in their postinstall, and both are silent
      # failures rather than loud ones: the package installs, the binary is simply absent,
      # and the error surfaces much later as something unrecognisable. `lightningcss-cli`
      # was missing from this list and the 1.0.0 publish died on it - `build:css` invoked a
      # binary that had never been fetched, so the shell read the placeholder's first line
      # and reported `1: This: not found`.
      #
      # `-r` is load-bearing, not decoration. Both packages are dependencies of the
      # `packages/ui` workspace project rather than of the root, and a non-recursive
      # `pnpm rebuild <name>` at the root silently matches nothing there and exits 0 - the
      # binary stays missing and the failure surfaces much later, in another job's step.
      #
      # `release-allowlist.test.ts` fails the build if a package with an install script is
      # missing from this list, so it cannot silently rot again.
      - name: Install
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild -r esbuild lightningcss-cli

      - name: Build the library
        run: pnpm --filter @the_viveksingh/vivek-ui build

      # Belt and braces: the tarball about to be published is re-tested in this job, not
      # trusted from the sibling job's run.
      - name: Test
        run: pnpm --filter @the_viveksingh/vivek-ui test

      # No NPM_TOKEN anywhere. The package is configured on npm to require 2FA and disallow
      # tokens, so token auth would be rejected outright. Authentication is the OIDC exchange
      # that `id-token: write` enables, and npm attaches the provenance attestation
      # automatically for a trusted-publisher publish - NPM_CONFIG_PROVENANCE is redundant.
      - name: Publish to npm via Trusted Publishing
        run: pnpm release

      # `changeset publish` creates the git tags locally (--git-tag defaults to true) but
      # does not push them, and the GitHub Releases the action would have made are gone with
      # the publish input. Both are recreated here.
      #
      # `|| true` on the release: a re-run after a partial failure would otherwise fail on a
      # tag that already has a release, turning a successful publish into a red run.
      - name: Push tags and create GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only tags matching the package's release pattern - `--tags` pushed every local
          # tag, which on a maintainer clone can include experiments.
          git push origin 'refs/tags/@the_viveksingh/vivek-ui@*'
          for tag in $(git tag --points-at HEAD); do
            echo "Creating release for $tag"
            gh release create "$tag" --title "$tag" --generate-notes \
              || echo "  release for $tag already exists, skipping"
          done
