name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only ever needs to read the tree. Without this the job inherits
# the repository default, which is read-write for every scope.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # CI never pushes, and it executes fork-PR code. Unlike release.yml - where the
      # changesets action needs these credentials to push the version branch - dropping
      # them here costs nothing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm exec biome ci .

      # A citation to an untracked working document inside a JSDoc comment survives into
      # the published .d.ts files, so the package would leak internal structure to every
      # consumer. See scripts/strip-internal-refs.mjs.
      - name: No references to internal documents
        run: node scripts/strip-internal-refs.mjs --check

      # The library MUST be built before the tests run.
      #
      # apps/docs imports @the_viveksingh/vivek-ui by package NAME, not by a relative path
      # into src - deliberately, because that is what exercises the exports map, and it has
      # caught five real packaging bugs. The consequence is that its tests resolve through
      # `exports` to ./dist/index.js, so with no dist they fail with:
      #
      #   Failed to resolve entry for package "@the_viveksingh/vivek-ui"
      #
      # Test used to run before Build here, which broke main for six consecutive commits.
      # Every local run passed, because dist already existed on a dev machine. The
      # `react 18 compatibility` job below never hit it, because it happens to build first.
      - name: Build the library
        run: pnpm --filter @the_viveksingh/vivek-ui build

      - name: Test
        run: pnpm -r test

      # Everything else: the docs site, which regenerates the props registry and fails if a
      # component is missing a preview or an example.
      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Size limit
        run: pnpm --filter @the_viveksingh/vivek-ui size

      # The README is the npm page, and prose is the one thing no other gate reads. Its
      # component catalogue is generated from the registry; this fails when it has drifted.
      # It listed none of the eight newest components, and claimed 44 server-safe when the
      # figure was 49, with every check green.
      - name: README catalogue is current
        run: node scripts/gen-readme-catalog.mjs --check

      # Packaging correctness, from the two tools the ecosystem actually uses.
      #
      # These caught a real defect that every other gate was blind to: the exports map
      # pointed both the `import` and `require` conditions at the same .d.ts, and because
      # the package is "type": "module" that declaration is ESM-flavoured. TypeScript under
      # `require` therefore resolved ESM types for a file Node loads as CommonJS - attw
      # calls it FalseESM, "Masquerading as ESM". Every test passed; CJS consumers got
      # wrong types.
      #
      # The CSS subpaths are excluded because attw only models JS/type resolution and
      # reports NoResolution for any stylesheet - a tool limitation, not a package defect.
      # packaging.test.ts asserts every .css export is listed here, because adding
      # ./print.css without extending this flag turned this step red for a full push.
      - name: Packaging lint (publint)
        working-directory: packages/ui
        run: npx --yes publint@0.3.24

      - name: Type resolution across module systems (are-the-types-wrong)
        working-directory: packages/ui
        run: npx --yes @arethetypeswrong/cli@0.18.5 --pack . --exclude-entrypoints ./styles.css ./charts.css ./print.css

      - name: Assert the published package has no runtime dependencies
        run: |
          node -e "
            const pkg = require('./packages/ui/package.json');
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error('@the_viveksingh/vivek-ui must ship zero runtime dependencies, found: ' + deps.join(', '));
              process.exit(1);
            }
            console.log('OK: no runtime dependencies');
          "

  react18:
    name: react 18 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # CI never pushes, and it executes fork-PR code. Unlike release.yml - where the
      # changesets action needs these credentials to push the version branch - dropping
      # them here costs nothing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library
        run: pnpm --filter @the_viveksingh/vivek-ui build

      # The peer range promises ^18 || ^19, so CI has to prove it.
      - name: Re-test against React 18
        run: |
          pnpm --filter @the_viveksingh/vivek-ui add -D react@18.3.1 react-dom@18.3.1 @types/react@18.3.12 @types/react-dom@18.3.1
          pnpm --filter @the_viveksingh/vivek-ui test

  e2e:
    name: browser layout + axe (3 viewports)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the library and the docs site
        run: pnpm -r build

      # The suite that closes the class of bug jsdom cannot see. Five layout defects
      # shipped in one week - a navbar painting over its links, a poster covering the
      # preview it sat behind, a missing hamburger that removed mobile navigation - and
      # 1,800+ unit tests stayed green through all of them, because jsdom has no layout
      # engine and reports every element as a visible 0x0 box. These specs run against the
      # real production build (next start, not dev - dev serves different CSS chunking) in
      # a real browser at phone, tablet and desktop widths, plus axe with real contrast
      # sampling on composed pages in both themes.
      - name: Install the CI browser
        working-directory: apps/docs
        run: npx playwright install chromium --with-deps

      - name: Layout, keyboard and axe specs
        working-directory: apps/docs
        run: npx playwright test e2e/layout.spec.ts e2e/a11y.spec.ts

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: playwright-failures
          path: apps/docs/test-results/
          retention-days: 7

  install-matrix:
    name: pack + install with npm, yarn and pnpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @the_viveksingh/vivek-ui build

      # The README says the package is verified against npm, yarn and pnpm. This is the
      # job that makes the sentence true: pack the real tarball, install it with each
      # manager into a bare project, and import it in a bare Node process - ESM and CJS -
      # with react present. It is also the only gate where a module-scope window/document
      # access would surface before a consumer hits it: the unit suite runs in jsdom,
      # where window always exists.
      - name: Pack the tarball
        id: pack
        working-directory: packages/ui
        run: echo "file=$(npm pack --pack-destination "$RUNNER_TEMP" | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Install with each manager, import under each module system
        env:
          TARBALL: ${{ runner.temp }}/${{ steps.pack.outputs.file }}
        run: |
          set -e
          node scripts/consume-check.mjs npm
          node scripts/consume-check.mjs yarn
          node scripts/consume-check.mjs pnpm

  node-matrix:
    name: dist runs on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # engines promises >=18; .nvmrc develops on 22. The floor is what consumers'
        # older SSR fleets actually run, so the floor is what gets executed here.
        node: ['18', '20']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # Build on the repo's Node, then EXECUTE on the matrix Node: the promise under test
      # is "the shipped dist runs on your Node", not "the toolchain runs everywhere".
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install and build on the development Node
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @the_viveksingh/vivek-ui build

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: SSR-render the dist on Node ${{ matrix.node }}
        run: node scripts/dist-smoke.mjs

